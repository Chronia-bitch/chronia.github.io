<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronia | Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #b18cf0;
            --purple-glow: rgba(177, 140, 240, 0.3);
            --glass: rgba(10, 10, 10, 0.6);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; cursor: crosshair; }

        body {
            background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh; line-height: 1.6; overflow-x: hidden;
        }

        /* --- Background Effects --- */
        .bg-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .gradient-orb { 
            position: absolute; width: 600px; height: 600px; 
            background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%); 
            top: -200px; left: -200px; filter: blur(80px); opacity: 0.4;
        }
        .scanlines { 
            position: fixed; inset: 0; 
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 51%); 
            background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.1;
        }

        .main-wrapper {
            max-width: 1200px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 30px;
        }

        /* --- Components --- */
        .box { 
            background: var(--glass); border: 1px solid var(--border); 
            border-radius: 12px; backdrop-filter: blur(12px); padding: 24px;
        }

        .section-title { 
            font-family: 'VT323'; font-size: 20px; color: var(--purple); 
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 15px; display: block;
        }

        /* --- Layout --- */
        .top-row {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            gap: 25px;
        }

        .col-sidebar { display: flex; flex-direction: column; gap: 20px; }
        
        .social-btn {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 8px; text-decoration: none; color: #fff;
            font-family: 'VT323'; font-size: 18px; transition: 0.2s; margin-bottom: 10px;
        }
        .social-btn:hover { background: var(--purple); color: #000; transform: translateX(5px); }
        .social-btn svg { width: 20px; fill: currentColor; }

        /* TERMINAL - FIXED SIZE FIX */
        .terminal { 
            height: 380px; /* Locked height so it never resizes the page */
            display: flex; flex-direction: column;
            background: rgba(0,0,0,0.4);
            border-top: 2px solid var(--purple);
            font-family: 'VT323';
            overflow: hidden; /* Keeps the container rigid */
        }
        #output { 
            flex-grow: 1; 
            overflow-y: auto; /* Internal scrolling only */
            color: #aaffaa; 
            font-size: 16px;
            padding-right: 5px;
        }
        .input-line { 
            display: flex; gap: 8px; align-items: center; 
            padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); 
            flex-shrink: 0; /* Prevents input line from disappearing */
        }
        #input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-family: 'VT323'; font-size: 18px; }

        /* Art Wall */
        .art-wall { display: grid; grid-template-columns: 1.2fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; }
        .art-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #000; }
        .art-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.5s; }
        .art-item:hover img { opacity: 1; }
        .art-item.featured { grid-row: span 2; }
        .artist-tag { position: absolute; bottom: 8px; right: 8px; font-family: 'VT323'; font-size: 12px; background: rgba(0,0,0,0.7); padding: 2px 8px; }

        /* Gloomwood */
        .gloom-box { text-align: center; display: flex; flex-direction: column; height: 100%; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .gloom-title { font-family: 'Pinyon Script'; font-size: 36px; color: var(--purple); margin: 0 0 10px 0; }
        .gloom-img { width: 100%; border-radius: 8px; border: 1px solid var(--border); flex-grow: 1; object-fit: cover; }

        /* Bottom Paragraphs */
        .bottom-area { display: flex; flex-direction: column; gap: 20px; padding-bottom: 60px; }
        .interest-box { border-left: 3px solid var(--purple); }

        .back-nav a { color: rgba(255,255,255,0.4); text-decoration: none; font-family: 'VT323'; font-size: 20px; }
        .back-nav a:hover { color: var(--purple); }

        .next-btn {
            position: fixed; bottom: 25px; right: 25px; width: 45px; height: 45px; 
            background: var(--glass); border: 1px solid var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; text-decoration: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--purple); }
    </style>
</head>
<body>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.toLowerCase().trim();
                let res = '';
                
                if (cmd === '/help') res = '-cat<br>-secret<br>-neofetch';
                else if (cmd === 'cat') res = '<img src="cat.png" style="width:100px; border-radius:8px; margin:5px 0;">';
                else if (cmd === 'secret') res = '<img src="putt.png" style="width:100px; border-radius:8px; margin:5px 0;">';
                else if (cmd === 'neofetch') res = '<img src="neo.png" style="width:120px; margin:5px 0;"><br>ram: 12gb<br>gpu: rx 6800 xt<br>cpu: i7-10700k';
                else if (cmd === 'throzyckd') res = 'putt';
                else if (cmd === '') return;
                else res = '<span style="color:#ff5555">command not found</span>';

                output.innerHTML += `<div><span style="opacity:0.5">> ${cmd}</span><br>${res}</div><br>`;
                input.value = '';
                
                // Auto-scroll the terminal output
                output.scrollTop = output.scrollHeight;
            }
        });
    </script>
