<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chronia | characters</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #c1483e;
            --black: #020202;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.12);
        }

        body, html { 
            background: var(--black); color: white; font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
        }

        /* Nav */
        .nav-header { position: fixed; top: 30px; left: 30px; z-index: 100; }
        .back-btn {
            padding: 8px 16px; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 8px; color: white; text-decoration: none; font-family: 'VT323'; font-size: 18px;
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .back-btn:hover { border-color: var(--theme-color); background: rgba(255,255,255,0.1); }

        .main-stage {
            display: grid; grid-template-columns: 350px 1fr 350px;
            align-items: center; height: 100vh; padding: 0 80px; gap: 40px;
        }

        .side-para {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 30px; border-radius: 20px; backdrop-filter: blur(15px);
            font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.7);
        }

        /* Consistent Sizing Container */
        .char-display { 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 80vh; /* Fixed height for all characters */
        }
        
        .char-img {
            height: 100%; /* Forces images to match the 80vh container */
            width: auto;
            object-fit: contain;
            z-index: 2; 
            transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            /* The Glow Effect */
            filter: drop-shadow(0 0 25px var(--theme-color));
        }

        .aura {
            position: absolute; width: 400px; height: 400px;
            background: var(--theme-color); filter: blur(120px);
            opacity: 0.15; border-radius: 50%; z-index: 1; transition: 1s;
        }

        .char-info { display: flex; flex-direction: column; gap: 30px; align-items: flex-end; text-align: right; }

        .name-box { 
            border-bottom: 2px solid var(--theme-color); padding: 5px 0; 
            font-family: 'VT323'; font-size: 48px;
            transition: 0.5s;
        }
        .desc-box { max-width: 300px; line-height: 1.5; color: rgba(255,255,255,0.6); font-size: 15px; font-style: italic; }

        /* Rotating Circle */
        .art-circle-wrap { position: relative; width: 180px; height: 180px; }
        .rotating-elements {
            width: 100%; height: 100%; position: absolute;
            animation: rotate 25s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .fan-art-node {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            border: 2px solid white; overflow: hidden; cursor: pointer;
            transition: 0.4s;
        }
        .fan-art-node:hover { transform: scale(1.1); border-color: var(--theme-color); }
        .fan-art-node img { width: 100%; height: 100%; object-fit: cover; }

        .node-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .node-2 { bottom: 10%; right: 0; transform: translate(30%, 0); }
        .node-3 { bottom: 10%; left: 0; transform: translate(-30%, 0); }

        .svg-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        textPath { font-family: 'VT323'; font-size: 13px; fill: rgba(255,255,255,0.4); letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="profile.html" class="back-btn">← Back</a>
    </div>

    <div class="main-stage">
        <div class="side-para">
            <p>Some of my few favorite characters from different media's!</p>
        </div>

        <div class="char-display">
            <div class="aura" id="aura"></div>
            <img src="Makima.png" class="char-img" id="main-char">
        </div>

        <div class="char-info">
            <div class="art-circle-wrap">
                <div class="rotating-elements">
                    <svg class="svg-text" viewBox="0 0 200 200">
                        <path id="txtPath" d="M 100, 100 m -85, 0 a 85,85 0 1,1 170,0 a 85,85 0 1,1 -170,0" fill="transparent"/>
                        <text><textPath href="#txtPath" id="artist-label">@chronia — FAVORITES — @chronia — FAVORITES —</textPath></text>
                    </svg>
                    <div class="fan-art-node node-1" onclick="update(0)"><img src="1.png" id="f1"></div>
                    <div class="fan-art-node node-2" onclick="update(1)"><img src="4.png" id="f2"></div>
                    <div class="fan-art-node node-3" onclick="update(2)"><img src="7.png" id="f3"></div>
                </div>
            </div>

            <div class="name-box" id="name">Makima</div>
            <div class="desc-box" id="desc">"Did you forget? You're my pet. Only answer with 'yes' or 'woof.' I don't need a dog who says 'no.'"</div>
        </div>
    </div>

    <script>
        const chars = [
            { n:"Makima", c:"#c1483e", i:"Makima.png", a:"@chronia", d:"\"Did you forget? You're my pet. Only answer with 'yes' or 'woof.' I don't need a dog who says 'no.'\"", f:["1.png","2.png","3.png"]},
            { n:"Lucy", c:"#f0d5fb", i:"Lucy.png", a:"@lucy_artist", d:"\"But you never had to save me. All I ever wanted was for you to live\"", f:["4.png","5.png","6.png"]},
            { n:"Power", c:"#c88b8a", i:"power.png", a:"@power_artist", d:"\"I've decided to win the Nobel Prize! The humans will all kowtow to me!\"", f:["7.png","8.png","9.png"]}
        ];

        function update(idx) {
            const ch = chars[idx];
            document.documentElement.style.setProperty('--theme-color', ch.c);
            document.getElementById('main-char').src = ch.i;
            document.getElementById('name').innerText = ch.n;
            document.getElementById('desc').innerText = ch.d;
            document.getElementById('artist-label').textContent = `${ch.a.toUpperCase()} — FAVORITES — ${ch.a.toUpperCase()} — FAVORITES —`;
        }

        let step = 0;
        setInterval(() => {
            step = (step + 1) % 3;
            document.getElementById('f1').src = chars[0].f[step];
            document.getElementById('f2').src = chars[1].f[step];
            document.getElementById('f3').src = chars[2].f[step];
        }, 4000);
    </script>
</body>
</html>
