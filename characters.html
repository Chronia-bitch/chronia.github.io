<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chronia | favorites</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #c1483e;
            --black: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html { 
            background: var(--black); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            height: 100vh;
        }

        /* Simple Navigation */
        .nav-header { position: fixed; top: 40px; left: 40px; z-index: 100; }
        .back-btn {
            padding: 10px 20px; 
            background: var(--glass); 
            border: 1px solid var(--border);
            border-radius: 50px; 
            color: white; 
            text-decoration: none; 
            font-family: 'VT323'; 
            font-size: 18px;
            backdrop-filter: blur(10px); 
            transition: 0.3s ease;
        }
        .back-btn:hover { 
            background: white;
            color: black;
        }

        .main-stage {
            display: grid; 
            grid-template-columns: 350px 1fr 350px;
            align-items: center; 
            height: 100vh; 
            padding: 0 80px; 
            gap: 40px;
        }

        /* Intro Text */
        .side-para {
            padding: 20px;
            border-left: 1px solid var(--theme-color);
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 100%);
        }
        .side-para h2 { font-family: 'VT323'; font-size: 28px; margin: 0 0 10px 0; color: var(--theme-color); }
        .side-para p { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.6); margin: 0; }

        /* Character Container (Consistent Sizing) */
        .char-display { 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 85vh; /* Fixed height for consistency */
        }
        .char-img {
            max-height: 100%; 
            max-width: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Ensures all characters are framed the same way */
            z-index: 5; 
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .aura {
            position: absolute; 
            width: 450px; height: 450px;
            background: var(--theme-color);
            filter: blur(120px);
            opacity: 0.2; 
            border-radius: 50%;
            z-index: 1; 
            transition: 1.2s ease;
        }

        /* Info & Selection */
        .char-info { display: flex; flex-direction: column; gap: 30px; align-items: flex-end; text-align: right; }

        .name-box { 
            font-family: 'VT323'; 
            font-size: 64px; 
            color: white;
            line-height: 1;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .desc-box { 
            max-width: 300px; 
            line-height: 1.6; 
            color: rgba(255,255,255,0.5); 
            font-size: 15px; 
            font-style: italic;
        }

        /* Interaction Wheel */
        .art-circle-wrap { position: relative; width: 180px; height: 180px; }
        .rotating-elements {
            width: 100%; height: 100%; position: absolute;
            animation: rotate 25s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .fan-art-node {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            border: 2px solid white; overflow: hidden; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #000;
        }
        .fan-art-node:hover { transform: scale(1.2) rotate(-10deg); border-color: var(--theme-color); }
        .fan-art-node img { width: 100%; height: 100%; object-fit: cover; }

        .node-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .node-2 { bottom: 10%; right: 0; transform: translate(30%, 0); }
        .node-3 { bottom: 10%; left: 0; transform: translate(-30%, 0); }

        .svg-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        textPath { font-family: 'VT323'; font-size: 13px; fill: rgba(255,255,255,0.3); letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="profile.html" class="back-btn">← PROFILE</a>
    </div>

    <div class="main-stage">
        <div class="side-para">
            <h2>COLLECTION</h2>
            <p>A curated showcase of my favorite characters and interests. Each one represents a different vibe or story that resonates with me personally.</p>
        </div>

        <div class="char-display">
            <div class="aura" id="aura"></div>
            <!-- Characters are now sized consistently within this frame -->
            <img src="Makima.PNG" class="char-img" id="main-char">
        </div>

        <div class="char-info">
            <div class="art-circle-wrap">
                <div class="rotating-elements">
                    <svg class="svg-text" viewBox="0 0 200 200">
                        <path id="txtPath" d="M 100, 100 m -80, 0 a 80,80 0 1,1 160,0 a 80,80 0 1,1 -160,0" fill="transparent"/>
                        <text><textPath href="#txtPath" id="artist-label">@CHRONIA — SELECTOR — @CHRONIA — SELECTOR —</textPath></text>
                    </svg>
                    <div class="fan-art-node node-1" onclick="update(0)"><img src="1.PNG" id="f1"></div>
                    <div class="fan-art-node node-2" onclick="update(1)"><img src="4.PNG" id="f2"></div>
                    <div class="fan-art-node node-3" onclick="update(2)"><img src="7.PNG" id="f3"></div>
                </div>
            </div>

            <div class="name-box" id="name">MAKIMA</div>
            <div class="desc-box" id="desc">"Did you forget? You're my pet. Only answer with 'yes' or 'woof.' I don't need a dog who says 'no.'"</div>
        </div>
    </div>

    <script>
        const chars = [
            { n:"MAKIMA", c:"#c1483e", i:"Makima.PNG", a:"@chronia", d:"\"Did you forget? You're my pet. Only answer with 'yes' or 'woof.' I don't need a dog who says 'no.'\"", f:["1.PNG","2.PNG","3.PNG"]},
            { n:"LUCY", c:"#d0b0ff", i:"Lucy.PNG", a:"@lucy_artist", d:"\"But you never had to save me. All I ever wanted was for you to live.\"", f:["4.PNG","5.PNG","6.PNG"]},
            { n:"POWER", c:"#e5a3a1", i:"Power.PNG", a:"@power_artist", d:"\"I've decided to win the Nobel Prize! The humans will all kowtow to me!\"", f:["7.PNG","8.PNG","9.PNG"]}
        ];

        function update(idx) {
            const ch = chars[idx];
            const img = document.getElementById('main-char');
            
            // Smooth fade transition
            img.style.opacity = '0';
            img.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                document.documentElement.style.setProperty('--theme-color', ch.c);
                img.src = ch.i;
                document.getElementById('name').innerText = ch.n;
                document.getElementById('desc').innerText = ch.d;
                document.getElementById('artist-label').textContent = `${ch.a.toUpperCase()} — SELECTOR — ${ch.a.toUpperCase()} — SELECTOR —`;
                
                img.style.opacity = '1';
                img.style.transform = 'scale(1)';
            }, 300);
        }

        // Live cycle for thumbnails
        let step = 0;
        setInterval(() => {
            step = (step + 1) % 3;
            document.getElementById('f1').src = chars[0].f[step];
            document.getElementById('f2').src = chars[1].f[step];
            document.getElementById('f3').src = chars[2].f[step];
        }, 4000);
    </script>
</body>
</html>
