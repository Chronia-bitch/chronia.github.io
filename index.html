<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chronia ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #9d7bc0;
    --white-accent: #ffffff;
    --black: #020202;
    --glass-bg: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.12);
    --glow: rgba(157, 123, 192, 0.25);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%; width:100%; overflow:hidden;
    background:var(--black); font-family:'Inter', sans-serif;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="9" stroke="white" stroke-width="1.5"/><line x1="12" y1="15" x2="12" y2="22" stroke="white" stroke-width="1.5"/><line x1="2" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.5"/><line x1="15" y1="12" x2="22" y2="12" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="white"/></svg>') 12 12, crosshair;
  }

  a, button{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><rect x="8" y="8" width="4" height="4" fill="white"/></svg>') 10 10, pointer; }

  /* ================= BACKGROUND ================= */
  .bg-gradient{ position:fixed; inset:0; z-index:0; background: linear-gradient(90deg, var(--purple) 0%, var(--black) 45%, var(--black) 55%, rgba(255,255,255,0.05) 100%); }
  .bg-dots{ position:fixed; inset:0; z-index:1; background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1.4px); background-size: 30px 30px; pointer-events:none; }
  .bg-scanlines{ position:fixed; inset:0; z-index:2; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px); mix-blend-mode: overlay; pointer-events:none; }
  .flare{ position:fixed; z-index:1; width:46vw; height:46vw; border-radius:50%; filter: blur(140px); opacity:0.22; pointer-events:none; }
  .flare.purple{ top:-10%; left:-12%; background:var(--purple); }
  .flare.white{ bottom:-14%; right:-12%; background:var(--white-accent); }

  /* ================= PARTICLES ================= */
  .particle-layer{ position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .particle{ position:absolute; width:3px; height:3px; background:#fff; border-radius:50%; opacity:0; box-shadow:0 0 6px 1px rgba(255,255,255,0.5); }

  /* ================= WATERMARK ================= */
  .watermark{ position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .watermark h1{ font-family:'Pinyon Script', cursive; font-weight:400; font-size: clamp(90px, 16vw, 220px); color: rgba(255,255,255,0.08); line-height:1; }

  /* ================= CARD ================= */
  .stage{ position:relative; z-index:6; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; perspective: 1200px; }
  .card{
    position:relative; width:100%; max-width:380px;
    background: linear-gradient(155deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.01) 28%, rgba(255,255,255,0.04) 100%), var(--glass-bg);
    backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%);
    border: 1px solid var(--glass-border); border-radius:44px; padding:42px 30px 30px;
    display:flex; flex-direction:column; align-items:center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.5), 0 40px 50px -30px var(--glow);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .avatar-wrap{ position:relative; width:132px; height:132px; margin-bottom:24px; }
  .avatar{ width:100%; height:100%; object-fit:cover; border-radius:28px; border:1.5px solid rgba(255,255,255,0.9); background: linear-gradient(135deg, var(--purple), #fff); }

  .name-row { display: flex; align-items: center; gap: 10px; }
  .name{ font-family:'VT323', monospace; font-size:28px; letter-spacing:3px; color:#fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
  
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #747f8d; transition: 0.4s ease; }
  .online { background: #43b581; box-shadow: 0 0 12px #43b581; }
  .idle   { background: #faa61a; box-shadow: 0 0 12px #faa61a; }
  .dnd    { background: #f04747; box-shadow: 0 0 12px #f04747; }

  .tagline{ margin-top:4px; font-family:'VT323', monospace; font-size:15px; letter-spacing:2px; color: rgba(255,255,255,0.4); }

  .dock{ margin-top:28px; width:100%; display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .pill{
    display:flex; align-items:center; justify-content:center; padding:12px; border-radius:18px;
    border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    color:#fff; text-decoration:none; font-family:'Inter', sans-serif; font-size:13px; font-weight:500; transition: all .3s ease;
  }
  .pill:hover{ transform: translateY(-3px); border-color: var(--purple); background: rgba(157, 123, 192, 0.15); box-shadow: 0 8px 24px rgba(157, 123, 192, 0.2); }

  /* ================= SPOTIFY SECTION ================= */
  .spotify-box {
    position: relative;
    margin-top: 28px; width: 100%; height: 74px;
    background: rgba(0,0,0,0.3); border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; padding: 0 14px; gap: 12px;
    overflow: hidden;
  }
  #spotify-album { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: opacity 0.3s ease; }
  .spotify-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #spotify-track { color: #fff; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #spotify-artist { color: rgba(255,255,255,0.4); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  /* Tooltip on Hover (Rounded Box) */
  .spotify-box:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 115%; left: 50%; transform: translateX(-50%);
    background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
    color: #fff; padding: 10px 14px; border-radius: 16px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.1); width: max-content; max-width: 240px;
    z-index: 100; text-align: center; white-space: pre-wrap;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none;
  }
  .spotify-box[data-tooltip=""]:hover::after { display: none; }

</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-dots"></div>
  <div class="flare purple"></div>
  <div class="flare white"></div>
  <div class="bg-scanlines"></div>
  <div class="particle-layer" id="particleLayer"></div>

  <div class="watermark">
    <h1>chronia</h1>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <img class="avatar" src="chronia6.png" alt="chronia">
      </div>

      <div class="name-row">
        <div class="name">chronia</div>
        <div id="status-dot" class="status-dot"></div>
      </div>
      <div class="tagline">yeah</div>

      <div class="dock">
        <a class="pill" href="https://discord.com/users/987815885702041610" target="_blank">Discord</a>
        <a class="pill" href="https://open.spotify.com/user/31mlgjgb7lw4vjyfwpmm6z2sgqde" target="_blank">Spotify</a>
        <a class="pill" href="https://x.com/Chronia69" target="_blank">𝕏</a>
        <a class="pill" href="https://www.roblox.com/users/502463017" target="_blank">Roblox</a>
      </div>

      <div class="spotify-box" id="spotify-box" data-tooltip="">
        <img id="spotify-album" src="https://i.imgur.com/8N97X76.png" alt="album">
        <div class="spotify-info">
          <div id="spotify-track">Not listening to anything</div>
          <div id="spotify-artist">Spotify</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DISCORD_ID = "987815885702041610";

    // ============= LANYARD WS (FIXED) =============
    function updateLanyard(data) {
      const { discord_status, listening_to_spotify, spotify } = data;
      const dot = document.getElementById('status-dot');
      dot.className = 'status-dot ' + (discord_status || 'offline');

      const track = document.getElementById('spotify-track');
      const artist = document.getElementById('spotify-artist');
      const album = document.getElementById('spotify-album');
      const box = document.getElementById('spotify-box');

      if (listening_to_spotify && spotify) {
        // Changed spotify.track to spotify.song (The API uses .song)
        track.innerText = spotify.song;
        artist.innerText = `by ${spotify.artist}`;
        album.src = spotify.album_art_url;
        album.style.opacity = "1";
        // Updated tooltip to use .song
        box.setAttribute('data-tooltip', `${spotify.song}\nby ${spotify.artist}`);
      } else {
        track.innerText = "Not listening to anything";
        artist.innerText = "Spotify";
        album.src = "https://i.imgur.com/8N97X76.png"; 
        album.style.opacity = "0.2";
        box.setAttribute('data-tooltip', "");
      }
    }

    function initLanyard() {
      const ws = new WebSocket('wss://api.lanyard.rest/socket');
      ws.onmessage = (event) => {
        const pkg = JSON.parse(event.data);
        if (pkg.op === 1) {
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
          setInterval(() => ws.send(JSON.stringify({ op: 3 })), pkg.d.heartbeat_interval);
        }
        if (pkg.t === 'INIT_STATE' || pkg.t === 'PRESENCE_UPDATE') updateLanyard(pkg.d);
      };
      ws.onclose = () => setTimeout(initLanyard, 5000);
    }
    initLanyard();

    // ============= ORIGINAL PARALLAX TILT =============
    const card = document.getElementById('card');
    let hoveringCard = false;
    let targetRotX = 0, targetRotY = 0, targetScale = 1;
    let curRotX = 0, curRotY = 0, curScale = 1;

    card.addEventListener('mouseenter', ()=>{ hoveringCard = true; });
    card.addEventListener('mouseleave', ()=>{ hoveringCard = false; });

    window.addEventListener('mousemove', (e)=>{
      const rect = card.getBoundingClientRect();
      if(hoveringCard){
        const relX = (e.clientX - rect.left)/rect.width - 0.5;
        const relY = (e.clientY - rect.top)/rect.height - 0.5;
        targetRotY = relX * 18; targetRotX = -relY * 18; targetScale = 1.015;
      } else {
        const cx = rect.left + rect.width/2; const cy = rect.top + rect.height/2;
        const relX = (e.clientX - cx)/window.innerWidth;
        const relY = (e.clientY - cy)/window.innerHeight;
        targetRotY = relX * 5; targetRotX = -relY * 5; targetScale = 1;
      }
    });

    function tickTilt(){
      curRotX += (targetRotX - curRotX) * 0.08;
      curRotY += (targetRotY - curRotY) * 0.08;
      curScale += (targetScale - curScale) * 0.08;
      card.style.transform = `rotateX(${curRotX}deg) rotateY(${curRotY}deg) scale(${curScale})`;
      requestAnimationFrame(tickTilt);
    }
    tickTilt();

    // ============= PARTICLES =============
    const particleLayer = document.getElementById('particleLayer');
    const particles = [];
    for(let i=0; i<40; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      particleLayer.appendChild(el);
      particles.push({
        el, x: Math.random()*100, y: Math.random()*100,
        s: 0.02 + Math.random()*0.04, d: (Math.random()-0.5)*0.02
      });
    }
    function animateParticles() {
      particles.forEach(p => {
        p.y -= p.s; p.x += p.d;
        if(p.y < -5) p.y = 105;
        p.el.style.left = p.x + 'vw'; p.el.style.top = p.y + 'vh';
        p.el.style.opacity = p.y < 20 ? p.y/20 : (p.y > 80 ? (100-p.y)/20 : 0.4);
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
