    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent-purple: #a855f7;
            --accent-orange: #f97316;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('https://cur.cursors-4u.net/games/gam-4/gam373.cur'), auto; /* Pixel Cursor */
        }

        body {
            background-color: var(--bg-dark);
            /* Background: Grainy Noir with Purple/Orange highlights */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(168, 85, 247, 0.15), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(249, 115, 22, 0.1), transparent 40%),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); /* Noise texture */
            color: white;
            font-family: 'VT323', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Silent Artistic Header */
        .silent-header {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: clamp(4rem, 10vw, 8rem);
            color: rgba(255, 255, 255, 0.07); /* Semi-transparent */
            z-index: 0;
            pointer-events: none;
            text-transform: lowercase;
            letter-spacing: -2px;
        }

        /* Windows 11 Glass Card */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 28px; /* Win 11 Rounded */
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Avatar with Y2K White Border */
        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            border: 3px solid white;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .subtext {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        /* Social Buttons */
        .social-dock {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-purple);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: white;
        }

        /* Bottom Scrolling Marquee (Y2K style) */
        .marquee {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(168, 85, 247, 0.05);
            padding: 5px 0;
            border-top: 1px solid var(--border);
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-content {
            display: inline-block;
            animation: scroll 20s linear infinite;
            font-size: 0.9rem;
            color: var(--accent-purple);
            opacity: 0.6;
        }

        @keyframes scroll {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .glass-card { padding: 25px; }
            .silent-header { font-size: 4rem; top: 15%; }
        }
    </style>
</head>
