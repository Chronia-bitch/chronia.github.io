<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chronia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #9d7bc0; /* Brighter, cleaner purple */
    --accent-white: rgba(255, 255, 255, 0.8);
    --black: #020202;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glow: rgba(157, 123, 192, 0.2); /* Purple glow instead of white */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow-x:hidden;
    background:var(--black);
    font-family:'Inter', sans-serif;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="9" stroke="white" stroke-width="1.5"/><line x1="12" y1="15" x2="12" y2="22" stroke="white" stroke-width="1.5"/><line x1="2" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.5"/><line x1="15" y1="12" x2="22" y2="12" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="white"/></svg>') 12 12, crosshair;
  }

  a, button{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><rect x="8" y="8" width="4" height="4" fill="white"/></svg>') 10 10, pointer; }

  /* ================= BACKGROUND SYSTEM ================= */
  .bg-gradient{
    position:fixed; inset:0; z-index:0;
    /* Ditching orange for purple-to-black-to-white depth */
    background: radial-gradient(circle at 0% 0%, var(--purple) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255,255,255,0.05) 0%, transparent 40%),
                var(--black);
  }

  .bg-dots{
    position:fixed; inset:0; z-index:1;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1.4px);
    background-size: 30px 30px;
    pointer-events:none;
  }

  .bg-scanlines{
    position:fixed; inset:0; z-index:2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    pointer-events:none;
  }

  .flare{
    position:fixed; z-index:1;
    width:50vw; height:50vw;
    border-radius:50%;
    filter: blur(160px);
    opacity:0.2;
    pointer-events:none;
  }
  .flare.purple{ top:-10%; left:-10%; background:var(--purple); }
  .flare.white{ bottom:-10%; right:-10%; background: #fff; }

  /* ================= PARTICLES ================= */
  .particle-layer{
    position:fixed; inset:0; z-index:4;
    pointer-events:none; overflow:hidden;
  }
  .particle{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.4);
  }

  /* ================= HEADER / WATERMARK ================= */
  .watermark{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }
  .watermark h1{
    font-family:'Pinyon Script', cursive;
    font-weight:400;
    font-size: clamp(90px, 16vw, 220px);
    color: rgba(255,255,255,0.07);
    line-height:1;
    display:flex;
    align-items:center;
    gap:0.25em;
  }
  .watermark .heart{
    font-size:0.34em;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
    -webkit-text-fill-color: rgba(255,255,255,0.4);
  }
  .watermark .sub{
    margin-top:6px;
    font-family:'VT323', monospace;
    letter-spacing:0.5em;
    text-transform:lowercase;
    font-size:18px;
    color: rgba(255,255,255,0.35);
  }

  /* ================= HERO CARD (LIQUID GLASS) ================= */
  .stage{
    position:relative;
    z-index:6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    perspective: 1500px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:380px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
    backdrop-filter: blur(45px) saturate(180%);
    -webkit-backdrop-filter: blur(45px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius:48px; /* Slightly rounder for iOS feel */
    padding:40px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.2),
      0 0 40px -10px var(--glow);
    transform-style: preserve-3d;
    transition: box-shadow .5s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow:hidden;
  }

  /* REPLACED THE "ARTIFACT" WITH LIQUID SATIN SHEEN */
  .card::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:48px;
    padding:1px;
    /* Precise iOS-style rim lighting */
    background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
  }

  .card > *{ position:relative; z-index:1; }

  .card:hover{
    box-shadow:
      0 40px 80px rgba(0,0,0,0.5),
      inset 0 1px 2px rgba(255,255,255,0.3),
      0 0 60px -5px var(--glow);
  }

  /* ================= AVATAR & CONTENT ================= */
  .avatar-wrap{
    position:relative;
    width:132px; height:132px;
    margin-bottom:24px;
  }
  .avatar-aura{
    position:absolute; inset:-20px;
    border-radius:40px;
    background: radial-gradient(circle, var(--purple), transparent 70%);
    filter: blur(20px);
    animation: aura-pulse 4s ease-in-out infinite;
    z-index:0;
    opacity: 0.3;
  }
  @keyframes aura-pulse{
    0%,100%{ opacity:0.2; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(1.1); }
  }
  .avatar{
    position:relative;
    z-index:1;
    width:100%; height:100%;
    object-fit:cover;
    border-radius:32px;
    border: 1.5px solid rgba(255,255,255,0.8);
    display:block;
    background: linear-gradient(135deg, var(--purple), #fff);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .name{
    font-family:'VT323', monospace;
    font-size:28px;
    letter-spacing:3px;
    color:#fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  .tagline{
    margin-top:4px;
    font-family:'VT323', monospace;
    font-size:15px;
    letter-spacing:2px;
    color: rgba(255,255,255,0.4);
    text-transform:lowercase;
  }

  .dock{
    margin-top:30px;
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 10px;
    border-radius:20px; /* Squircle style */
    border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color:#fff;
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    transition: all .3s ease;
  }
  .pill svg{ width:16px; height:16px; opacity: 0.8; }
  .pill:hover{
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  .visualizer-wrap{
    margin-top:30px;
    width:100%;
    height:52px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
    overflow:hidden;
  }
  #viz{ width:100%; height:100%; display:block; filter: drop-shadow(0 0 8px var(--purple)); }

  /* ================= UI ELEMENTS ================= */
  .sound-toggle{
    position:fixed;
    top:24px; right:24px;
    z-index:20;
    width:48px; height:48px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all .3s ease;
  }
  .sound-toggle:hover{
    background: rgba(255,255,255,0.15);
    border-color: var(--purple);
    box-shadow: 0 0 20px var(--glow);
  }

  @media (max-width: 420px){
    .watermark h1{ font-size: 22vw; }
  }
</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-dots"></div>
  <div class="flare purple"></div>
  <div class="flare white"></div>
  <div class="bg-scanlines"></div>
  <div class="particle-layer" id="particleLayer"></div>

  <div class="watermark">
    <h1>chronia <span class="heart">🤍</span></h1>
    <div class="sub">yeah</div>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
    <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="4,9 8,9 12,5 12,19 8,15 4,15" fill="currentColor" stroke="none"/>
      <path d="M16 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>
    </svg>
    <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4,9 8,9 12,5 12,19 8,15 4,15" fill="currentColor" stroke="none"/>
      <line x1="16" y1="9" x2="21" y2="14"/>
      <line x1="21" y1="9" x2="16" y2="14"/>
    </svg>
  </button>

  <div class="stage">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <div class="avatar-aura"></div>
        <!-- Note: Ensure chronia5.jpg exists in your folder -->
        <img class="avatar" src="chronia5.jpg" alt="chronia" onerror="this.style.objectFit='contain'; this.alt='chronia5.jpg not found';">
      </div>

      <div class="name">chronia</div>
      <div class="tagline">yeah</div>

      <div class="dock">
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.673-3.548-13.662a.06.06 0 0 0-.031-.028Z"/></svg>
          Discord
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.34c-.23.36-.7.47-1.06.24-2.9-1.77-6.55-2.17-10.85-1.19-.42.1-.83-.17-.93-.58-.1-.42.17-.83.58-.93 4.7-1.07 8.73-.61 11.98 1.4.36.22.47.7.24 1.06h.04Zm1.47-3.27c-.29.45-.88.6-1.33.31-3.32-2.04-8.38-2.63-12.3-1.44-.51.15-1.05-.13-1.2-.64-.15-.51.13-1.05.64-1.2 4.48-1.36 10.04-.7 13.87 1.65.45.28.6.87.31 1.32h.01Zm.13-3.41C15.03 8.3 8.99 8.1 5.5 9.16c-.61.18-1.25-.16-1.43-.77-.18-.61.16-1.25.77-1.43 4.02-1.22 10.7-.98 14.93 1.53.55.32.72 1.03.4 1.58-.32.55-1.03.72-1.57.4v-.01Z"/></svg>
          Spotify
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231Zm-1.161 17.52h1.833L7.045 4.126H5.078Z"/></svg>
          𝕏
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="6.2" y="6.2" width="11.6" height="11.6" rx="2" transform="rotate(-16 12 12)"/>
            <rect x="9.6" y="9.6" width="4.8" height="4.8" rx="0.8" transform="rotate(-16 12 12)" fill="currentColor" stroke="none"/>
          </svg>
          Roblox
        </a>
      </div>

      <div class="visualizer-wrap">
        <canvas id="viz"></canvas>
      </div>
    </div>
  </div>

  <audio id="bgAudio" loop preload="auto"></audio>

  <script>
    // ============= PARTICLE SYSTEM =============
    const particleLayer = document.getElementById('particleLayer');
    const NUM_PARTICLES = 44;
    const particles = [];

    function makeParticle(){
      const el = document.createElement('div');
      el.className = 'particle';
      particleLayer.appendChild(el);
      return {
        el,
        x: Math.random()*100,
        y: 115 + Math.random()*20,
        speed: 0.02 + Math.random()*0.045,
        drift: (Math.random()-0.5)*0.02,
        size: 2 + Math.random()*3
      };
    }

    for(let i=0;i<NUM_PARTICLES;i++){
      const p = makeParticle();
      p.y = 115 + Math.random()*100;
      particles.push(p);
    }

    function animateParticles(){
      particles.forEach(p=>{
        p.y -= p.speed;
        p.x += p.drift;
        if(p.y < -10){
          p.y = 115 + Math.random()*15;
          p.x = Math.random()*100;
        }
        let opacity = 1;
        if(p.y > 100) opacity = 1 - (p.y - 100)/15;
        else if(p.y < 12) opacity = p.y/12;

        p.el.style.left = p.x + 'vw';
        p.el.style.top = p.y + 'vh';
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
        p.el.style.opacity = Math.max(0, Math.min(1, opacity)) * 0.6;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============= PARALLAX TILT =============
    const card = document.getElementById('card');
    let hoveringCard = false;
    let targetRotX = 0, targetRotY = 0, targetScale = 1;
    let curRotX = 0, curRotY = 0, curScale = 1;

    card.addEventListener('mouseenter', ()=>{ hoveringCard = true; });
    card.addEventListener('mouseleave', ()=>{ hoveringCard = false; });

    window.addEventListener('mousemove', (e)=>{
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;

      if(hoveringCard){
        const relX = (e.clientX - rect.left)/rect.width - 0.5;
        const relY = (e.clientY - rect.top)/rect.height - 0.5;
        targetRotY = relX * 20;
        targetRotX = -relY * 20;
        targetScale = 1.02;
      } else {
        const relX = (e.clientX - cx)/window.innerWidth;
        const relY = (e.clientY - cy)/window.innerHeight;
        targetRotY = relX * 4;
        targetRotX = -relY * 4;
        targetScale = 1;
      }
    });

    function tickTilt(){
      curRotX += (targetRotX - curRotX) * 0.1;
      curRotY += (targetRotY - curRotY) * 0.1;
      curScale += (targetScale - curScale) * 0.1;
      card.style.transform = `rotateX(${curRotX}deg) rotateY(${curRotY}deg) scale(${curScale})`;
      requestAnimationFrame(tickTilt);
    }
    tickTilt();

    // ============= AUDIO ENGINE + VISUALIZER =============
    const AUDIO_SRC = "song.mp3";
    const audio = document.getElementById('bgAudio');
    audio.src = AUDIO_SRC;

    const soundToggle = document.getElementById('soundToggle');
    const iconOn = document.getElementById('iconOn');
    const iconOff = document.getElementById('iconOff');
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray, bufferLength;
    let started = false;
    let muted = false;

    function setIcon(isMuted){
      iconOn.style.display = isMuted ? 'none' : 'block';
      iconOff.style.display = isMuted ? 'block' : 'none';
    }

    function resizeCanvas(){
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function initAudioGraph(){
      if(audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    let smoothed = null;
    const SAMPLE_POINTS = 32;

    function drawViz(){
      requestAnimationFrame(drawViz);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(!analyser) return;

      analyser.getByteFrequencyData(dataArray);

      const step = Math.floor(bufferLength / SAMPLE_POINTS);
      const points = [];
      for(let i=0;i<SAMPLE_POINTS;i++){
        const val = dataArray[i*step] / 255.0;
        points.push(val);
      }

      if(!smoothed) smoothed = points.slice();
      for(let i=0;i<points.length;i++){
        smoothed[i] += (points[i]-smoothed[i]) * 0.2;
      }

      const w = canvas.width, h = canvas.height;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      
      const barWidth = w / SAMPLE_POINTS;
      for(let i=0; i<SAMPLE_POINTS; i++) {
        const bh = smoothed[i] * h * 0.8;
        ctx.moveTo(i * barWidth + barWidth/2, h/2 - bh/2);
        ctx.lineTo(i * barWidth + barWidth/2, h/2 + bh/2);
      }
      ctx.stroke();
    }
    drawViz();

    function startAudio(){
      if(started) return;
      started = true;
      initAudioGraph();
      audio.volume = 0.5;
      audio.play().then(()=>setIcon(false)).catch(()=>started=false);
    }

    document.body.addEventListener('click', ()=>{ if(!started) startAudio(); }, { once:false });

    soundToggle.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!started){ startAudio(); return; }
      if(muted){
        audio.play(); muted = false; setIcon(false);
      } else {
        audio.pause(); muted = true; setIcon(true);
      }
    });
  </script>
</body>
</html>
