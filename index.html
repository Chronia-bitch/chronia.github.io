<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronia</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #070707;
            --accent-purple: #9d4edd;
            --accent-orange: #ff9100;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        /* Parallax Background Layer */
        #bg-layer {
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            /* Replace with your NY Noir Image Link */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); 
            background-size: cover;
            z-index: -1;
            transition: transform 0.1s ease-out;
        }

        /* Mouse Shimmer Effect */
        #shimmer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
                        rgba(157, 78, 221, 0.15) 0%, 
                        rgba(255, 145, 0, 0.05) 25%, 
                        transparent 50%);
            z-index: 0;
        }

        /* The Silent Header */
        .silent-header {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(3rem, 12vw, 9rem);
            color: rgba(255, 255, 255, 0.08);
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
            z-index: 1;
            pointer-events: none;
        }

        /* Audio Visualizer Canvas */
        #visualizer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            opacity: 0.6;
        }

        /* Main Glass Card */
        .glass-card {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 50px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(157, 78, 221, 0.1);
            transition: transform 0.1s ease-out;
        }

        /* Avatar with White Glow */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 25px;
            border: 2px solid rgba(255,255,255,0.8);
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 0 35px 5px rgba(255, 255, 255, 0.6), 
                        0 0 60px rgba(157, 78, 221, 0.4);
        }

        .subtext { font-size: 1.3rem; color: #aaa; margin-bottom: 35px; }

        /* Social Icons Grid */
        .social-dock { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .social-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 12px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--border); border-radius: 15px;
            text-decoration: none; color: white; transition: 0.3s;
        }

        .social-btn:hover {
            border-color: var(--accent-purple);
            background: rgba(157, 78, 221, 0.1);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
            transform: translateY(-2px);
        }

        .social-btn svg { width: 18px; height: 18px; margin-right: 10px; fill: white; }

        /* Audio Mute Button */
        #mute-toggle {
            position: fixed;
            top: 20px; right: 20px;
            background: none; border: none;
            color: white; font-size: 24px;
            opacity: 0.5; transition: 0.3s;
            z-index: 100;
        }
        #mute-toggle:hover { opacity: 1; transform: scale(1.1); }

        /* Page Centering */
        .wrapper {
            height: 100vh; display: flex;
            justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <div id="shimmer"></div>

    <button id="mute-toggle">🔊</button>
    <h1 class="silent-header">chronia 🤍</h1>

    <div class="wrapper">
        <div class="glass-card" id="card">
            <!-- Ensure your image is named chronia5.jpg in the same folder -->
            <img src="chronia5.jpg" alt="Chronia" class="avatar">
            
            <p class="subtext">yeah</p>

            <div class="social-dock">
                <a href="https://discord.com/users/987815885702041610" class="social-btn">

                <a href="https://x.com/Chronia69" class="social-btn">

                    𝕏

                <a href="https://www.roblox.com/users/502463017/profile" class="social-btn">

                    <svg viewBox="0 0 24 24"><path d="M5.345 5.03L18.97 1.48L22.655 15.65L9.03 19.2L5.345 5.03Z"/></svg>
                    Roblox
                </a>
            </div>
            
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <!-- AUDIO FILE LINK - Swap 'song.mp3' with your actual file -->
    <audio id="bg-music" loop src="song.mp3"></audio>

    <script>
        const card = document.getElementById('card');
        const bg = document.getElementById('bg-layer');
        const shimmer = document.getElementById('shimmer');
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-toggle');

        // PARALLAX & SHIMMER LOGIC
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 25;
            const y = (window.innerHeight / 2 - e.pageY) / 25;
            
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
            bg.style.transform = `translate(${x*0.5}px, ${y*0.5}px)`;
            
            shimmer.style.setProperty('--x', e.clientX + 'px');
            shimmer.style.setProperty('--y', e.clientY + 'px');
        });

        // AUDIO VISUALIZER LOGIC
        let context, analyser, src, array;
        const canvas = document.getElementById("visualizer");
        const ctx = canvas.getContext("2d");

        function initVisualizer() {
            context = new (window.AudioContext || window.webkitAudioContext)();
            analyser = context.createAnalyser();
            src = context.createMediaElementSource(music);
            src.connect(analyser);
            analyser.connect(context.destination);
            analyser.fftSize = 64;
            array = new Uint8Array(analyser.frequencyBinCount);
            loop();
        }

        function loop() {
            window.requestAnimationFrame(loop);
            analyser.getByteFrequencyData(array);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#9d4edd"; // Purple Visualizer
            for (let i = 0; i < array.length; i++) {
                const barHeight = array[i] / 4;
                ctx.fillRect(i * 12, canvas.height - barHeight, 8, barHeight);
            }
        }

        // START MUSIC ON CLICK (Browser Requirement)
        window.addEventListener('click', () => {
            if (!context) initVisualizer();
            music.play();
        }, { once: true });

        muteBtn.addEventListener('click', () => {
            if (music.muted) {
                music.muted = false; muteBtn.innerText = '🔊';
            } else {
                music.muted = true; muteBtn.innerText = '🔇';
            }
        });
    </script>

</body>
</html>
