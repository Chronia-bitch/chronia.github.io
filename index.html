<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chronia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #9d4edd;
    --orange: #ff9100;
    --black: #020202;
    --glass-bg: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.14);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow-x:hidden;
    background:var(--black);
    font-family:'Inter', sans-serif;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="9" stroke="white" stroke-width="1.5"/><line x1="12" y1="15" x2="12" y2="22" stroke="white" stroke-width="1.5"/><line x1="2" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.5"/><line x1="15" y1="12" x2="22" y2="12" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="white"/></svg>') 12 12, crosshair;
  }

  a, button{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><rect x="8" y="8" width="4" height="4" fill="white"/></svg>') 10 10, pointer; }

  /* ================= BACKGROUND SYSTEM ================= */
  .bg-gradient{
    position:fixed; inset:0; z-index:0;
    background: linear-gradient(
      90deg,
      var(--purple) 0%,
      var(--black) 45%,
      var(--black) 55%,
      var(--orange) 100%
    );
  }

  .bg-dots{
    position:fixed; inset:0; z-index:1;
    background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.4px);
    background-size: 30px 30px;
    pointer-events:none;
  }

  .bg-scanlines{
    position:fixed; inset:0; z-index:2;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.25) 0px,
      rgba(0,0,0,0.25) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    pointer-events:none;
  }

  .flare{
    position:fixed; z-index:1;
    width:46vw; height:46vw;
    border-radius:50%;
    filter: blur(120px);
    opacity:0.55;
    pointer-events:none;
  }
  .flare.purple{ top:-10%; left:-12%; background:var(--purple); }
  .flare.orange{ bottom:-14%; right:-12%; background:var(--orange); }

  .shimmer{
    position:fixed; z-index:3;
    width:420px; height:420px;
    border-radius:50%;
    pointer-events:none;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 70%);
    transform:translate(-50%,-50%);
    transition: opacity .3s ease;
    will-change: left, top;
  }

  /* ================= PARTICLES ================= */
  .particle-layer{
    position:fixed; inset:0; z-index:4;
    pointer-events:none; overflow:hidden;
  }
  .particle{
    position:absolute;
    bottom:-10px;
    width:3px; height:3px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.8);
  }

  /* ================= HEADER / WATERMARK ================= */
  .watermark{
    position:fixed;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }
  .watermark h1{
    font-family:'Pinyon Script', cursive;
    font-weight:400;
    font-size: clamp(90px, 16vw, 220px);
    color: rgba(255,255,255,0.10);
    line-height:1;
    display:flex;
    align-items:center;
    gap:0.25em;
  }
  .watermark .heart{
    font-size:0.34em;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.35));
    -webkit-text-fill-color: rgba(255,255,255,0.6);
  }
  .watermark .sub{
    margin-top:6px;
    font-family:'VT323', monospace;
    letter-spacing:0.5em;
    text-transform:lowercase;
    font-size:18px;
    color: rgba(255,255,255,0.55);
  }

  /* ================= HERO CARD ================= */
  .stage{
    position:relative;
    z-index:6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    perspective: 1200px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:380px;
    background: var(--glass-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border);
    border-radius:40px;
    padding:38px 30px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transform-style: preserve-3d;
    transition: transform .12s ease-out;
  }

  .avatar-wrap{
    position:relative;
    width:132px; height:132px;
    margin-bottom:20px;
  }
  .avatar-aura{
    position:absolute; inset:-18px;
    border-radius:34px;
    background: radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
    filter: blur(14px);
    animation: aura-pulse 3.2s ease-in-out infinite;
    z-index:0;
  }
  @keyframes aura-pulse{
    0%,100%{ opacity:0.55; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.08); }
  }
  .avatar{
    position:relative;
    z-index:1;
    width:100%; height:100%;
    object-fit:cover;
    border-radius:20px;
    border:1.5px solid rgba(255,255,255,0.85);
    display:block;
    background: linear-gradient(135deg, var(--purple), var(--orange));
  }

  .name{
    font-family:'VT323', monospace;
    font-size:26px;
    letter-spacing:3px;
    color:#fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.4);
  }
  .tagline{
    margin-top:6px;
    font-family:'VT323', monospace;
    font-size:15px;
    letter-spacing:2px;
    color: rgba(255,255,255,0.5);
    text-transform:lowercase;
  }

  .dock{
    margin-top:26px;
    width:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:12px 10px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.03);
    color:#fff;
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:0.3px;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  .pill svg{ width:16px; height:16px; flex-shrink:0; }
  .pill:hover{
    transform: translateY(-3px);
    border-color: var(--purple);
    background: rgba(157,78,221,0.12);
    box-shadow: 0 8px 22px rgba(157,78,221,0.45);
  }

  .visualizer-wrap{
    margin-top:26px;
    width:100%;
    height:52px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.02);
    overflow:hidden;
  }
  #viz{ width:100%; height:100%; display:block; }

  /* ================= SOUND TOGGLE ================= */
  .sound-toggle{
    position:fixed;
    top:22px; right:24px;
    z-index:20;
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    color:#fff;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all .2s ease;
  }
  .sound-toggle:hover{
    border-color: var(--orange);
    box-shadow: 0 0 18px rgba(255,145,0,0.5);
  }

  @media (max-width: 420px){
    .watermark h1{ font-size: 22vw; }
  }
</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-dots"></div>
  <div class="flare purple"></div>
  <div class="flare orange"></div>
  <div class="bg-scanlines"></div>
  <div class="shimmer" id="shimmer"></div>
  <div class="particle-layer" id="particleLayer"></div>

  <div class="watermark">
    <h1>chronia <span class="heart">🤍</span></h1>
    <div class="sub">yeah</div>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">🔇</button>

  <div class="stage">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <div class="avatar-aura"></div>
        <img class="avatar" src="chronia5.jpg" alt="chronia" onerror="this.style.objectFit='contain'; this.alt='chronia5.jpg not found — place it next to index.html';">
      </div>

      <div class="name">chronia</div>
      <div class="tagline">yeah</div>

      <div class="dock">
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.673-3.548-13.662a.06.06 0 0 0-.031-.028Z"/></svg>
          Discord
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.34c-.23.36-.7.47-1.06.24-2.9-1.77-6.55-2.17-10.85-1.19-.42.1-.83-.17-.93-.58-.1-.42.17-.83.58-.93 4.7-1.07 8.73-.61 11.98 1.4.36.22.47.7.24 1.06h.04Zm1.47-3.27c-.29.45-.88.6-1.33.31-3.32-2.04-8.38-2.63-12.3-1.44-.51.15-1.05-.13-1.2-.64-.15-.51.13-1.05.64-1.2 4.48-1.36 10.04-.7 13.87 1.65.45.28.6.87.31 1.32h.01Zm.13-3.41C15.03 8.3 8.99 8.1 5.5 9.16c-.61.18-1.25-.16-1.43-.77-.18-.61.16-1.25.77-1.43 4.02-1.22 10.7-.98 14.93 1.53.55.32.72 1.03.4 1.58-.32.55-1.03.72-1.57.4v-.01Z"/></svg>
          Spotify
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231Zm-1.161 17.52h1.833L7.045 4.126H5.078Z"/></svg>
          𝕏
        </a>
        <a class="pill" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 4.5h6.7l2.7 15h-6.7l-2.7-15Zm7.53 0h6.7l2.77 15h-6.77l-2.7-15Z" transform="rotate(6 12 12)"/></svg>
          Roblox
        </a>
      </div>

      <div class="visualizer-wrap">
        <canvas id="viz"></canvas>
      </div>
    </div>
  </div>

  <audio id="bgAudio" src="song.mp3" loop preload="auto"></audio>

  <script>
    // ============= PARTICLE SYSTEM =============
    const particleLayer = document.getElementById('particleLayer');
    const NUM_PARTICLES = 44;
    const particles = [];

    function makeParticle(){
      const el = document.createElement('div');
      el.className = 'particle';
      particleLayer.appendChild(el);
      return {
        el,
        x: Math.random()*100,
        y: 115 + Math.random()*20,
        speed: 0.02 + Math.random()*0.045,
        drift: (Math.random()-0.5)*0.02,
        size: 2 + Math.random()*3
      };
    }

    for(let i=0;i<NUM_PARTICLES;i++){
      const p = makeParticle();
      p.y = 115 + Math.random()*100; // stagger initial heights
      particles.push(p);
    }

    function animateParticles(){
      particles.forEach(p=>{
        p.y -= p.speed;
        p.x += p.drift;
        if(p.y < -10){
          p.y = 115 + Math.random()*15;
          p.x = Math.random()*100;
        }

        // fade in as entering from bottom (115 -> 100), fade out near top (10 -> -10)
        let opacity = 1;
        if(p.y > 100){
          opacity = 1 - (p.y - 100)/15; // fade in over 115->100
        } else if(p.y < 12){
          opacity = p.y/12; // fade out over 12->-10 range approx
        }
        opacity = Math.max(0, Math.min(1, opacity));

        p.el.style.left = p.x + 'vw';
        p.el.style.top = p.y + 'vh';
        p.el.style.width = p.size + 'px';
        p.el.style.height = p.size + 'px';
        p.el.style.opacity = opacity * 0.85;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============= SHIMMER FOLLOW CURSOR =============
    const shimmer = document.getElementById('shimmer');
    window.addEventListener('mousemove', (e)=>{
      shimmer.style.left = e.clientX + 'px';
      shimmer.style.top = e.clientY + 'px';
    });

    // ============= PARALLAX TILT (card only) =============
    const card = document.getElementById('card');
    card.addEventListener('mousemove', (e)=>{
      const rect = card.getBoundingClientRect();
      const relX = (e.clientX - rect.left)/rect.width - 0.5;
      const relY = (e.clientY - rect.top)/rect.height - 0.5;
      const rotY = relX * 14;
      const rotX = -relY * 14;
      card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.01)`;
    });
    card.addEventListener('mouseleave', ()=>{
      card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
    });

    // ============= AUDIO ENGINE + VISUALIZER =============
    const audio = document.getElementById('bgAudio');
    const soundToggle = document.getElementById('soundToggle');
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray, bufferLength;
    let started = false;
    let muted = true;

    function resizeCanvas(){
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function initAudioGraph(){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      bufferLength = analyser.frequencyBinCount;
      dataArray = new Uint8Array(bufferLength);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    }

    function drawViz(){
      requestAnimationFrame(drawViz);
      if(!analyser){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        return;
      }
      analyser.getByteTimeDomainData(dataArray);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      const sliceWidth = canvas.width / bufferLength;
      let x = 0;
      for(let i=0;i<bufferLength;i++){
        const v = dataArray[i]/128.0;
        const y = (v * canvas.height)/2;
        if(i===0){ ctx.moveTo(x,y); } else { ctx.lineTo(x,y); }
        x += sliceWidth;
      }
      ctx.lineTo(canvas.width, canvas.height/2);
      ctx.stroke();
    }
    drawViz();

    function startAudio(){
      if(started) return;
      started = true;
      initAudioGraph();
      audio.volume = 0.6;
      audio.play().then(()=>{
        muted = false;
        soundToggle.textContent = '🔊';
      }).catch(()=>{
        muted = true;
        soundToggle.textContent = '🔇';
      });
    }

    document.body.addEventListener('click', startAudio, { once:true });

    soundToggle.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!started){ startAudio(); return; }
      if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
      if(muted){
        audio.play();
        muted = false;
        soundToggle.textContent = '🔊';
      } else {
        audio.pause();
        muted = true;
        soundToggle.textContent = '🔇';
      }
    });
  </script>
</body>
</html>
