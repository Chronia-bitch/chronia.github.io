<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronia</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --accent-purple: #9d4edd;
            --accent-orange: #ff9100;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body, html {
            height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }

        /* 1. RETRO DOTS & LIGHT FLARES */
        .background-container {
            position: fixed;
            width: 110%; height: 110%;
            top: -5%; left: -5%;
            z-index: -1;
            /* The Dot Grid */
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Permanent Visible Lights */
        .flare {
            position: absolute;
            width: 60vw; height: 60vw;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
        }
        .flare-purple { top: -10%; left: -10%; background: var(--accent-purple); }
        .flare-orange { bottom: -10%; right: -10%; background: var(--accent-orange); }

        /* 2. MOUSE SHIMMER */
        #shimmer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
                        rgba(157, 78, 221, 0.2) 0%, 
                        transparent 40%);
            z-index: 0;
        }

        /* 3. SILENT PINYON HEADER */
        .silent-header {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(3rem, 12vw, 10rem);
            color: rgba(255, 255, 255, 0.1);
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        /* 4. GLASS CARD */
        .wrapper {
            height: 100vh; display: flex;
            justify-content: center; align-items: center;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 50px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transition: transform 0.1s ease-out;
        }

        /* White Glow Avatar */
        .avatar {
            width: 140px; height: 140px;
            border-radius: 20px;
            border: 2px solid white;
            object-fit: cover;
            margin-bottom: 20px;
            /* Strong White "Aura" Glow */
            box-shadow: 0 0 25px 5px rgba(255, 255, 255, 0.5), 
                        0 0 50px rgba(157, 78, 221, 0.3);
        }

        .subtext { font-size: 1.3rem; color: #888; margin-bottom: 35px; }

        /* Social Icons */
        .social-dock { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .social-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 12px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--border); border-radius: 12px;
            text-decoration: none; color: white; transition: 0.3s;
        }

        .social-btn:hover {
            border-color: var(--accent-purple);
            background: rgba(157, 78, 221, 0.1);
            transform: translateY(-2px);
        }

        .social-btn svg { width: 18px; height: 18px; margin-right: 10px; fill: white; }

        /* Audio Visualizer */
        #visualizer {
            width: 100%; height: 30px;
            margin-top: 25px; opacity: 0.4;
        }

        #mute-toggle {
            position: fixed; top: 25px; right: 25px;
            background: none; border: none; color: white;
            font-size: 24px; opacity: 0.4; transition: 0.3s; z-index: 100;
        }
        #mute-toggle:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="background-container" id="bg">
        <div class="flare flare-purple"></div>
        <div class="flare flare-orange"></div>
    </div>

    <div id="shimmer"></div>

    <button id="mute-toggle">🔊</button>
    <h1 class="silent-header">chronia 🤍</h1>

    <div class="wrapper">
        <div class="glass-card" id="card">
            <!-- Ensure your image is named chronia5.jpg in your GitHub folder -->
            <img src="chronia5.jpg" alt="Chronia" class="avatar">
            <p class="subtext">yeah</p>

            <div class="social-dock">
                <a href="https://discord.com/users/987815885702041610" class="social-btn">

                    Discord

                <a href="https://open.spotify.com/user/31mlgjgb7lw4vjyfwpmm6z2sgqde" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.508 17.308c-.216.354-.675.467-1.028.249-2.833-1.73-6.398-2.122-10.601-1.158-.403.092-.809-.16-.901-.563-.092-.403.16-.809.563-.901 4.594-1.05 8.528-.604 11.718 1.344.353.218.465.676.249 1.03zm1.472-3.262c-.272.441-.849.582-1.289.31-3.242-1.991-8.185-2.57-11.285-1.63-.498.151-1.025-.133-1.176-.632-.151-.498.133-1.025.632-1.176 3.652-1.107 9.1-0.45 12.819 1.83.441.272.582.849.31 1.289zm.129-3.41c-3.888-2.31-10.306-2.522-14.032-1.391-.595.18-1.222-.162-1.403-.757-.181-.595.163-1.222.757-1.403 4.286-1.301 11.373-1.045 15.823 1.597.534.317.708 1.004.391 1.538-.316.534-1.003.708-1.536.39z"/></svg>
                    Spotify
                </a>
                <a href="https://x.com/Chronia69" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    𝕏

                <a href="https://www.roblox.com/users/502463017/profile" class="social-btn">

                    <svg viewBox="0 0 24 24"><path d="M5.345 5.03L18.97 1.48L22.655 15.65L9.03 19.2L5.345 5.03Z"/></svg>
                    Roblox
                </a>
            </div>
            
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <!-- Replace 'song.mp3' with your actual file name -->
    <audio id="bg-music" loop src="song.mp3"></audio>

    <script>
        const card = document.getElementById('card');
        const bg = document.getElementById('bg');
        const shimmer = document.getElementById('shimmer');
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-toggle');

        // SUBTLE PARALLAX (Tuned down to /120 and /150 for tiny movement)
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 120;
            const y = (window.innerHeight / 2 - e.pageY) / 150;
            
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
            bg.style.transform = `translate(${x*0.2}px, ${y*0.2}px)`;
            
            shimmer.style.setProperty('--x', e.clientX + 'px');
            shimmer.style.setProperty('--y', e.clientY + 'px');
        });

        // VISUALIZER
        let context, analyser, src, array;
        const canvas = document.getElementById("visualizer");
        const ctx = canvas.getContext("2d");

        function initVisualizer() {
            context = new (window.AudioContext || window.webkitAudioContext)();
            analyser = context.createAnalyser();
            src = context.createMediaElementSource(music);
            src.connect(analyser);
            analyser.connect(context.destination);
            analyser.fftSize = 64;
            array = new Uint8Array(analyser.frequencyBinCount);
            loop();
        }

        function loop() {
            window.requestAnimationFrame(loop);
            analyser.getByteFrequencyData(array);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(157, 78, 221, 0.5)"; 
            for (let i = 0; i < array.length; i++) {
                const barHeight = array[i] / 5;
                ctx.fillRect(i * 14, canvas.height - barHeight, 10, barHeight);
            }
        }

        window.addEventListener('click', () => {
            if (!context) initVisualizer();
            music.play();
        }, { once: true });

        muteBtn.addEventListener('click', () => {
            if (music.muted) {
                music.muted = false; muteBtn.innerText = '🔊';
            } else {
                music.muted = true; muteBtn.innerText = '🔇';
            }
        });
    </script>

</body>
</html>
