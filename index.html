<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chronia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #9d7bc0;
    --accent-white: rgba(255, 255, 255, 0.8);
    --black: #020202;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glow: rgba(157, 123, 192, 0.2);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background:var(--black);
    font-family:'Inter', sans-serif;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="2" x2="12" y2="9" stroke="white" stroke-width="1.5"/><line x1="12" y1="15" x2="12" y2="22" stroke="white" stroke-width="1.5"/><line x1="2" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.5"/><line x1="15" y1="12" x2="22" y2="12" stroke="white" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="white"/></svg>') 12 12, crosshair;
  }

  a, button{ cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><rect x="8" y="8" width="4" height="4" fill="white"/></svg>') 10 10, pointer; }

  /* ================= BACKGROUND SYSTEM ================= */
  .bg-gradient{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(circle at 0% 0%, var(--purple) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(255,255,255,0.04) 0%, transparent 45%),
                var(--black);
  }

  .bg-dots{
    position:fixed; inset:0; z-index:1;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.4px);
    background-size: 30px 30px;
    pointer-events:none;
  }

  .bg-scanlines{
    position:fixed; inset:0; z-index:2;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    pointer-events:none;
  }

  .flare{
    position:fixed; z-index:1;
    width:50vw; height:50vw;
    border-radius:50%;
    filter: blur(160px);
    opacity:0.15;
    pointer-events:none;
  }
  .flare.purple{ top:-10%; left:-10%; background:var(--purple); }
  .flare.white{ bottom:-10%; right:-10%; background: #fff; }

  .particle-layer{
    position:fixed; inset:0; z-index:4;
    pointer-events:none; overflow:hidden;
  }
  .particle{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 4px 1px rgba(255,255,255,0.3);
  }

  /* ================= WATERMARK ================= */
  .watermark{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; pointer-events:none;
  }
  .watermark h1{
    font-family:'Pinyon Script', cursive;
    font-size: clamp(90px, 16vw, 220px);
    color: rgba(255,255,255,0.05);
    line-height:1; display:flex; align-items:center; gap:0.25em;
  }
  .watermark .sub{
    margin-top:6px; font-family:'VT323', monospace;
    letter-spacing:0.5em; font-size:18px;
    color: rgba(255,255,255,0.25);
  }

  /* ================= HERO CARD (LIQUID GLASS) ================= */
  .stage{
    position:relative; z-index:6;
    min-height:100vh; display:flex;
    align-items:center; justify-content:center;
    padding:40px 20px; perspective: 1500px;
  }

  .card{
    position:relative; width:100%; max-width:380px;
    background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
    backdrop-filter: blur(50px) saturate(180%);
    -webkit-backdrop-filter: blur(50px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius:44px;
    padding:40px 30px;
    display:flex; flex-direction:column; align-items:center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.15);
    transform-style: preserve-3d;
    transition: box-shadow .5s cubic-bezier(0.2, 0.8, 0.2, 1);
    overflow:hidden;
  }

  .card::after{
    content:""; position:absolute; inset:0; border-radius:44px; padding:1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.1) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
  }

  .avatar-wrap{
    position:relative; width:120px; height:120px; margin-bottom:24px;
  }
  .avatar{
    position:relative; z-index:1; width:100%; height:100%;
    object-fit:cover; border-radius:34px;
    border: 1.5px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .name{ font-family:'VT323', monospace; font-size:28px; letter-spacing:3px; color:#fff; }
  .tagline{ margin-top:4px; font-family:'VT323', monospace; font-size:15px; letter-spacing:2px; color: rgba(255,255,255,0.4); }

  .dock{ margin-top:30px; width:100%; display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .pill{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 10px; border-radius:18px;
    border:1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color:#fff; text-decoration:none; font-family:'Inter', sans-serif; font-size:13px; font-weight:500;
    transition: all .3s ease;
  }
  .pill:hover{ background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

  .visualizer-wrap{
    margin-top:30px; width:100%; height:50px;
    border-radius:18px; border:1px solid rgba(255,255,255,0.08);
    background: rgba(0,0,0,0.15); overflow:hidden;
  }
  #viz{ width:100%; height:100%; display:block; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

  /* ================= SOUND TOGGLE (FIXED SIZE & CENTERED) ================= */
  .sound-toggle{
    position:fixed; top:24px; right:24px; z-index:20;
    width:38px; height:38px; /* Smaller icon size */
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    color:#fff;
    display:flex; align-items:center; justify-content:center; /* Perfect Centering */
    transition: all .3s ease;
  }
  .sound-toggle svg{ width:18px; height:18px; display: block; } /* Consistent SVG size */
  .sound-toggle:hover{ background: rgba(255,255,255,0.15); border-color: var(--purple); }

</style>
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-dots"></div>
  <div class="flare purple"></div>
  <div class="flare white"></div>
  <div class="bg-scanlines"></div>
  <div class="particle-layer" id="particleLayer"></div>

  <div class="watermark">
    <h1>chronia <span class="heart">🤍</span></h1>
    <div class="sub">yeah</div>
  </div>

  <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
    <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <div class="stage">
    <div class="card" id="card">
      <div class="avatar-wrap">
        <img class="avatar" src="chronia5.jpg" alt="chronia">
      </div>
      <div class="name">chronia</div>
      <div class="tagline">yeah</div>
      <div class="dock">
        <a class="pill" href="#">Discord</a>
        <a class="pill" href="#">Spotify</a>
        <a class="pill" href="#">𝕏</a>
        <a class="pill" href="#">Roblox</a>
      </div>
      <div class="visualizer-wrap">
        <canvas id="viz"></canvas>
      </div>
    </div>
  </div>

  <audio id="bgAudio" loop preload="auto"></audio>

  <script>
    // ============= DUST PARTICLES (IMMEDIATE SPAWN) =============
    const particleLayer = document.getElementById('particleLayer');
    const particles = [];
    for(let i=0; i<50; i++){
      const el = document.createElement('div');
      el.className = 'particle';
      particleLayer.appendChild(el);
      const p = {
        el, x: Math.random()*100, 
        y: Math.random()*110, // Randomized Y to ensure dust is on screen at start
        speed: 0.02 + Math.random()*0.04,
        opacity: 0
      };
      particles.push(p);
    }

    function animateParticles(){
      particles.forEach(p=>{
        p.y -= p.speed;
        if(p.y < -5) p.y = 105;
        let o = 1;
        if(p.y > 90) o = (105-p.y)/15;
        else if(p.y < 15) o = p.y/15;
        p.el.style.transform = `translate(${p.x}vw, ${p.y}vh)`;
        p.el.style.opacity = Math.max(0, o) * 0.4;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============= CENTER-OUT LIQUID VISUALIZER =============
    const AUDIO_SRC = "song.mp3";
    const audio = document.getElementById('bgAudio');
    audio.src = AUDIO_SRC;
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray;
    let smoothed = new Array(32).fill(0);

    function resize(){
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawViz(){
      requestAnimationFrame(drawViz);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(!analyser) return;

      analyser.getByteFrequencyData(dataArray);
      const w = canvas.width, h = canvas.height;
      const centerX = w / 2;
      const barCount = 18; // Per side
      const barWidth = 4 * devicePixelRatio;
      const spacing = 6 * devicePixelRatio;

      ctx.fillStyle = '#fff';

      for(let i=0; i < barCount; i++){
        // Use lower frequency data (bass/mids) for more movement
        const raw = dataArray[i] / 255;
        // Smoothing formula for "liquid" feel
        smoothed[i] += (raw - smoothed[i]) * 0.15; 
        
        const barHeight = Math.max(4, smoothed[i] * h * 0.9);
        
        // Draw Right
        ctx.beginPath();
        ctx.roundRect(centerX + (i * spacing), (h - barHeight)/2, barWidth, barHeight, 10);
        ctx.fill();
        
        // Draw Left (Mirrored)
        if(i > 0) {
            ctx.beginPath();
            ctx.roundRect(centerX - (i * spacing) - barWidth, (h - barHeight)/2, barWidth, barHeight, 10);
            ctx.fill();
        }
      }
    }
    drawViz();

    // ============= SOUND SYSTEM =============
    const soundToggle = document.getElementById('soundToggle');
    const iconOn = document.getElementById('iconOn');
    const iconOff = document.getElementById('iconOff');
    let started = false, muted = true;

    function startAudio(){
      if(started) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      audio.volume = 0.5;
      audio.play();
      started = true; muted = false;
      iconOn.style.display='block'; iconOff.style.display='none';
    }

    soundToggle.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!started) { startAudio(); return; }
      if(muted){
        audio.play(); muted = false;
        iconOn.style.display='block'; iconOff.style.display='none';
      } else {
        audio.pause(); muted = true;
        iconOn.style.display='none'; iconOff.style.display='block';
      }
    });

    // ============= PARALLAX =============
    const card = document.getElementById('card');
    window.addEventListener('mousemove', (e)=>{
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - (rect.left + rect.width/2)) / 15;
      const y = (e.clientY - (rect.top + rect.height/2)) / 15;
      card.style.transform = `rotateX(${-y}deg) rotateY(${x}deg)`;
    });
  </script>
</body>
</html>
