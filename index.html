<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronia</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #020202;
            --accent-purple: #9d4edd;
            --accent-orange: #ff9100;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body, html {
            height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'VT323', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. SEAMLESS BACKGROUND - No black bars, smooth merge */
        .full-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -5;
            background: linear-gradient(90deg, 
                rgba(157, 78, 221, 0.4) 0%, 
                rgba(2, 2, 2, 1) 45%, 
                rgba(2, 2, 2, 1) 55%, 
                rgba(255, 145, 0, 0.3) 100%);
        }

        /* Dots Overlay */
        .dots {
            position: fixed;
            inset: 0;
            z-index: -4;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* Scanline Overlay */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* 2. CHRONIA HEADER (Centered, Static) */
        .silent-header {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(5rem, 15vw, 13rem);
            color: rgba(255, 255, 255, 0.12);
            text-shadow: 0 0 30px rgba(157, 78, 221, 0.1);
            z-index: -1;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        /* 3. PARTICLE SYSTEM (Fade In/Out Logic) */
        .particle {
            position: fixed;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: -2;
            /* Animation: Movement + Fade sequence */
            animation: float-up linear infinite, fade-cycle linear infinite;
        }

        @keyframes float-up {
            from { transform: translateY(115vh) translateX(0); }
            to { transform: translateY(-15vh) translateX(40px); }
        }

        @keyframes fade-cycle {
            0% { opacity: 0; }
            15% { opacity: 0.5; } /* Fade in as it enters screen */
            85% { opacity: 0.5; } 
            100% { opacity: 0; } /* Fade out before it leaves screen */
        }

        /* 4. TITLE CARD (Parallax Target) */
        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 50px;
            width: 420px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            /* Smooth transition for the tilt */
            transition: transform 0.1s ease-out;
        }

        .avatar {
            width: 150px; height: 150px;
            border-radius: 20px;
            border: 2px solid white;
            object-fit: cover;
            margin-bottom: 25px;
            box-shadow: 0 0 20px 2px white, 0 0 40px rgba(157, 78, 221, 0.4);
        }

        .subtext { font-size: 1.4rem; color: #999; margin-bottom: 35px; letter-spacing: 2px; }

        /* Social Buttons */
        .social-dock { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        
        .social-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 12px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); border-radius: 12px;
            text-decoration: none; color: white; transition: 0.3s;
        }

        .social-btn:hover {
            border-color: var(--accent-purple);
            background: rgba(157, 78, 221, 0.15);
            transform: translateY(-3px);
        }

        .social-btn svg { width: 18px; height: 18px; margin-right: 10px; fill: white; }

        /* Audio Controls */
        #visualizer { width: 100%; height: 35px; margin-top: 20px; opacity: 0.4; }

        #mute-toggle {
            position: fixed; top: 30px; right: 30px;
            background: none; border: none; color: white;
            font-size: 26px; opacity: 0.4; transition: 0.3s; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="full-bg"></div>
    <div class="dots"></div>
    <div class="scanlines"></div>

    <button id="mute-toggle">🔊</button>
    <h1 class="silent-header">chronia 🤍</h1>

    <!-- Centered Parallax Card -->
    <div class="wrapper">
        <div class="glass-card" id="card">
            <!-- Ensure chronia5.jpg is in your GitHub repo -->
            <img src="chronia5.jpg" alt="Chronia" class="avatar">
            <p class="subtext">yeah</p>

            <div class="social-dock">
                <a href="https://discord.com/users/987815885702041610" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                    Discord
                </a>
                <a href="https://open.spotify.com/user/31mlgjgb7lw4vjyfwpmm6z2sgqde" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.508 17.308c-.216.354-.675.467-1.028.249-2.833-1.73-6.398-2.122-10.601-1.158-.403.092-.809-.16-.901-.563-.092-.403.16-.809.563-.901 4.594-1.05 8.528-.604 11.718 1.344.353.218.465.676.249 1.03zm1.472-3.262c-.272.441-.849.582-1.289.31-3.242-1.991-8.185-2.57-11.285-1.63-.498.151-1.025-.133-1.176-.632-.151-.498.133-1.025.632-1.176 3.652-1.107 9.1-0.45 12.819 1.83.441.272.582.849.31 1.289zm.129-3.41c-3.888-2.31-10.306-2.522-14.032-1.391-.595.18-1.222-.162-1.403-.757-.181-.595.163-1.222.757-1.403 4.286-1.301 11.373-1.045 15.823 1.597.534.317.708 1.004.391 1.538-.316.534-1.003.708-1.536.39z"/></svg>
                    Spotify
                </a>
                <a href="https://x.com/Chronia69" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    𝕏
                </a>
                <a href="https://www.roblox.com/users/502463017/profile" class="social-btn">
                    <svg viewBox="0 0 24 24"><path d="M5.345 5.03L18.97 1.48L22.655 15.65L9.03 19.2L5.345 5.03Z"/></svg>
                    Roblox
                </a>
            </div>
            
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <!-- Ensure song.mp3 is in your GitHub repo -->
    <audio id="bg-music" loop src="song.mp3"></audio>

    <script>
        const card = document.getElementById('card');
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-toggle');

        // 1. DUST PARTICLES (Out of frame spawn + fade)
        function createDust() {
            for(let i=0; i<35; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.width = Math.random()*3 + 1 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random()*100 + 'vw';
                
                // Random speeds and delays for variation
                p.style.animationDuration = Math.random()*8 + 7 + 's';
                p.style.animationDelay = Math.random()*5 + 's';
                
                document.body.appendChild(p);
            }
        }
        createDust();

        // 2. PARALLAX (Strictly restricted to the card)
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 80;
            const y = (window.innerHeight / 2 - e.pageY) / 80;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        // 3. AUDIO VISUALIZER
        let context, analyser, src, array;
        const canvas = document.getElementById("visualizer");
        const ctx = canvas.getContext("2d");

        function initVisualizer() {
            context = new (window.AudioContext || window.webkitAudioContext)();
            analyser = context.createAnalyser();
            src = context.createMediaElementSource(music);
            src.connect(analyser);
            analyser.connect(context.destination);
            analyser.fftSize = 64;
            array = new Uint8Array(analyser.frequencyBinCount);
            loop();
        }

        function loop() {
            window.requestAnimationFrame(loop);
            analyser.getByteFrequencyData(array);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)"; 
            for (let i = 0; i < array.length; i++) {
                const barHeight = array[i] / 5;
                ctx.fillRect(i * 14, canvas.height - barHeight, 10, barHeight);
            }
        }

        window.addEventListener('click', () => {
            if (!context) initVisualizer();
            music.play();
        }, { once: true });

        muteBtn.addEventListener('click', () => {
            music.muted = !music.muted;
            muteBtn.innerText = music.muted ? '🔇' : '🔊';
        });
    </script>
</body>
</html>
